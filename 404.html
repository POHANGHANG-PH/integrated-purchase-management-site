<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Monthly BOM Purchase Planning</title>
    <script>
      const path = window.location.pathname;
      const repoBase = '/integrated-purchase-management-site/';
      const appBase = repoBase + 'app/';
      if (path.startsWith(repoBase)) {
        window.sessionStorage.setItem('spa-redirect-path', path + window.location.search + window.location.hash);
        const reloadUrl = new URL(path.startsWith(appBase) ? appBase : repoBase, window.location.origin);
        reloadUrl.searchParams.set('_routeReload', Date.now().toString());
        window.location.replace(reloadUrl.toString());
      } else {
        window.location.replace('/');
      }
    </script>
  </head>
  <body></body>
</html>

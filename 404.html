<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Monthly BOM Purchase Planning</title>
    <script>
      const path = window.location.pathname;
      const repoBase = '/integrated-purchase-management-system/';
      if (path.startsWith(repoBase)) {
        window.sessionStorage.setItem('spa-redirect-path', path + window.location.search + window.location.hash);
        window.location.replace(repoBase);
      } else {
        window.location.replace('/');
      }
    </script>
  </head>
  <body></body>
</html>

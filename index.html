<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>News 브리핑</title>
    <style>
      :root {
        color: #172033;
        background: #f4f6fa;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #f4f6fa;
      }

      a {
        color: #114d97;
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }

      button {
        font: inherit;
      }

      .shell {
        min-height: 100vh;
        padding: 24px;
      }

      .page {
        max-width: 1440px;
        margin: 0 auto;
      }

      .topbar {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 16px;
      }

      .eyebrow {
        margin: 0 0 6px;
        font-size: 12px;
        font-weight: 700;
        color: #456179;
        letter-spacing: 0;
      }

      h1 {
        margin: 0;
        font-size: 30px;
        line-height: 1.18;
        font-weight: 800;
        color: #101828;
      }

      .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 10px;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        min-height: 28px;
        padding: 4px 10px;
        border: 1px solid #cdd8e4;
        border-radius: 4px;
        background: #fff;
        color: #34495e;
        font-size: 12px;
        font-weight: 700;
      }

      .nav {
        display: flex;
        gap: 8px;
        align-items: center;
      }

      .nav button {
        min-width: 86px;
        min-height: 34px;
        border: 1px solid #b8c6d5;
        border-radius: 4px;
        background: #fff;
        color: #1f3449;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
      }

      .nav button:disabled {
        cursor: default;
        color: #98a7b7;
        background: #edf1f5;
      }

      .summary {
        display: grid;
        grid-template-columns: minmax(0, 1.45fr) repeat(3, minmax(0, 1fr));
        gap: 10px;
        margin-bottom: 12px;
      }

      .summary-box {
        min-height: 86px;
        border: 1px solid #c9d6e3;
        border-radius: 6px;
        background: #fff;
        padding: 12px;
      }

      .summary-box strong {
        display: block;
        margin-bottom: 6px;
        font-size: 13px;
        color: #183450;
      }

      .summary-box p {
        margin: 0;
        font-size: 14px;
        line-height: 1.5;
        color: #26394d;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .panel {
        min-height: 360px;
        border: 1px solid #bcccdc;
        border-radius: 6px;
        background: #fff;
        overflow: hidden;
      }

      .panel-head {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
        border-bottom: 2px solid #174a8b;
        background: linear-gradient(180deg, #fff, #f8fbff);
      }

      .panel-number {
        display: grid;
        place-items: center;
        width: 30px;
        height: 30px;
        border-radius: 4px;
        background: #123d73;
        color: #fff;
        font-size: 18px;
        font-weight: 900;
      }

      .panel-title {
        margin: 0;
        font-size: 20px;
        line-height: 1.25;
        font-weight: 850;
        color: #101828;
      }

      .panel-body {
        display: grid;
        gap: 10px;
        padding: 12px;
      }

      .mini-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }

      .block {
        border: 1px solid #d5e0ea;
        border-radius: 5px;
        background: #fbfdff;
        padding: 10px;
      }

      .block h3 {
        margin: 0 0 7px;
        font-size: 13px;
        font-weight: 800;
        color: #15395d;
      }

      ul {
        margin: 0;
        padding-left: 18px;
      }

      li {
        margin: 0 0 6px;
        font-size: 13px;
        line-height: 1.42;
        color: #23384f;
      }

      li:last-child {
        margin-bottom: 0;
      }

      .empty {
        color: #718195;
      }

      .error {
        border: 1px solid #f2b8b5;
        background: #fff5f4;
        color: #8d1f17;
        padding: 12px;
        border-radius: 6px;
        font-size: 14px;
        font-weight: 700;
      }

      .notice {
        margin-top: 12px;
        color: #5f6f82;
        font-size: 12px;
        line-height: 1.5;
      }

      @media (max-width: 980px) {
        .shell {
          padding: 14px;
        }

        .topbar {
          align-items: stretch;
          flex-direction: column;
        }

        .summary,
        .grid,
        .mini-grid {
          grid-template-columns: 1fr;
        }

        h1 {
          font-size: 25px;
        }

        .panel-title {
          font-size: 18px;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <div class="page">
        <div class="topbar">
          <div>
            <p class="eyebrow">PUBLIC NEWS DASHBOARD</p>
            <h1>News 브리핑</h1>
            <div class="meta" id="meta"></div>
          </div>
          <div class="nav">
            <button id="newer" type="button">다음</button>
            <button id="older" type="button">이전</button>
          </div>
        </div>

        <section class="summary" id="summary"></section>
        <section class="grid" id="grid"></section>
        <p class="notice">공개 페이지에는 뉴스 본문, 출처 링크, 시황 요약 JSON만 표시됩니다. GitHub/Apps Script/Telegram 토큰 및 관리자 키는 포함하지 않습니다.</p>
      </div>
    </main>

    <script>
      const state = { items: [], index: 0 };
      const headers = {
        conclusion: "한 줄 결론",
        direction: "가격 방향성",
        steelDaily: "스틸데일리 오늘의 이슈",
        domestic: "국내 주요 뉴스",
        overseas: "해외 주요 뉴스",
        global: "글로벌 주요 이슈",
        market: "원자재/환율/운임/시세",
        risks: "리스크",
        action: "오늘의 구매 액션"
      };

      function decodeHtml(value) {
        const box = document.createElement("textarea");
        box.innerHTML = value || "";
        return box.value;
      }

      function stripTags(value) {
        return decodeHtml(String(value || "").replace(/<[^>]+>/g, "")).trim();
      }

      function parseLine(line) {
        const link = line.match(/<a\s+[^>]*href=["']([^"']+)["'][^>]*>(.*?)<\/a>/i);
        const text = stripTags(line).replace(/\s+/g, " ").trim();
        const href = link && /^https?:\/\//i.test(link[1]) ? link[1] : "";
        return { text, href };
      }

      function parseSections(message) {
        const sections = {};
        let current = "본문";
        const lines = String(message || "").split(/\n+/).map((line) => line.trim()).filter(Boolean);

        for (const line of lines) {
          const header = line.match(/^<b>(.*?)<\/b>$/i);
          if (header) {
            current = stripTags(header[1]);
            sections[current] = sections[current] || [];
            continue;
          }

          sections[current] = sections[current] || [];
          sections[current].push(parseLine(line));
        }

        return sections;
      }

      function findSection(sections, keyword) {
        const found = Object.entries(sections).find(([name]) => name.includes(keyword));
        return found ? found[1] : [];
      }

      function firstText(lines, fallback) {
        return (lines.find((line) => line.text)?.text || fallback || "자료없음").replace(/^[-\d.\s]+/, "");
      }

      function parseDate(item) {
        const source = item.sent_at || item.title || item.id || "";
        const match = String(source).match(/20\d{2}-\d{2}-\d{2}/);
        return match ? match[0] : "날짜 미확인";
      }

      function compareItems(a, b) {
        return parseDate(b).localeCompare(parseDate(a)) || String(b.sent_at || "").localeCompare(String(a.sent_at || ""));
      }

      function uniqItems(groups) {
        const map = new Map();
        groups.flatMap((group) => Array.isArray(group?.items) ? group.items : []).forEach((item) => {
          const key = item.id || item.sent_at || item.title || JSON.stringify(item).slice(0, 80);
          map.set(key, item);
        });
        return [...map.values()].sort(compareItems);
      }

      async function loadJson(path) {
        const response = await fetch(path + "?v=" + Date.now(), { cache: "no-store" });
        if (!response.ok) throw new Error(path + " 응답 실패");
        return response.json();
      }

      function renderMeta(item) {
        const meta = document.getElementById("meta");
        const date = parseDate(item);
        meta.innerHTML = "";
        [
          "기준일 " + date,
          item.notice_type === "morning" ? "오전 브리핑" : "뉴스 브리핑",
          item.source_chat_title || item.sender || "steel-telegram-news-bot"
        ].forEach((text) => {
          const span = document.createElement("span");
          span.className = "pill";
          span.textContent = text;
          meta.appendChild(span);
        });
      }

      function renderSummary(sections, item) {
        const summary = document.getElementById("summary");
        summary.innerHTML = "";
        const conclusion = findSection(sections, headers.conclusion);
        const direction = findSection(sections, headers.direction);
        const market = findSection(sections, headers.market);
        const action = findSection(sections, headers.action);
        const rows = [
          ["핵심 결론", firstText(conclusion, item.impact || item.title)],
          ["가격 방향", firstText(direction, "방향성 확인 필요")],
          ["환율/원자재", firstText(market, "자료없음")],
          ["구매 액션", firstText(action, item.impact || "확인 필요")]
        ];

        rows.forEach(([label, value]) => {
          const box = document.createElement("article");
          box.className = "summary-box";
          box.innerHTML = "<strong></strong><p></p>";
          box.querySelector("strong").textContent = label;
          box.querySelector("p").textContent = value;
          summary.appendChild(box);
        });
      }

      function appendList(container, lines, limit) {
        const ul = document.createElement("ul");
        const slice = lines.slice(0, limit);
        if (!slice.length) {
          const li = document.createElement("li");
          li.className = "empty";
          li.textContent = "자료없음";
          ul.appendChild(li);
        } else {
          slice.forEach((line) => {
            const li = document.createElement("li");
            if (line.href) {
              const a = document.createElement("a");
              a.href = line.href;
              a.target = "_blank";
              a.rel = "noreferrer";
              a.textContent = line.text;
              li.appendChild(a);
            } else {
              li.textContent = line.text;
            }
            ul.appendChild(li);
          });
        }
        container.appendChild(ul);
      }

      function block(title, lines, limit = 8) {
        const div = document.createElement("div");
        div.className = "block";
        const h3 = document.createElement("h3");
        h3.textContent = title;
        div.appendChild(h3);
        appendList(div, lines, limit);
        return div;
      }

      function panel(number, title, children, useMiniGrid = false) {
        const article = document.createElement("article");
        article.className = "panel";
        article.innerHTML = `<div class="panel-head"><span class="panel-number">${number}</span><h2 class="panel-title"></h2></div><div class="panel-body"></div>`;
        article.querySelector(".panel-title").textContent = title;
        const body = article.querySelector(".panel-body");
        if (useMiniGrid) body.classList.add("mini-grid");
        children.forEach((child) => body.appendChild(child));
        return article;
      }

      function renderItem() {
        const item = state.items[state.index];
        const sections = parseSections(item.message_text || "");
        renderMeta(item);
        renderSummary(sections, item);

        const market = findSection(sections, headers.market);
        const direction = findSection(sections, headers.direction);
        const steelDaily = findSection(sections, headers.steelDaily);
        const domestic = findSection(sections, headers.domestic);
        const overseas = findSection(sections, headers.overseas);
        const global = findSection(sections, headers.global);
        const risks = findSection(sections, headers.risks);
        const action = findSection(sections, headers.action);

        const grid = document.getElementById("grid");
        grid.innerHTML = "";
        grid.appendChild(panel(1, "글로벌 금리/환율/원자재", [block("원자재 · 환율 · 운임", market, 8), block("가격 방향성", direction, 6)], true));
        grid.appendChild(panel(2, "스틸데일리 이슈 + 철강시황", [block("주요 기사", steelDaily, 12)]));
        grid.appendChild(panel(3, "글로벌 경제/시황 이슈", [block("국내", domestic, 6), block("해외", overseas, 5), block("글로벌", global, 6)], true));
        grid.appendChild(panel(4, "추가 특이사항", [block("리스크", risks, 6), block("오늘의 구매 액션", action, 6)], true));

        document.getElementById("newer").disabled = state.index <= 0;
        document.getElementById("older").disabled = state.index >= state.items.length - 1;
      }

      async function main() {
        try {
          const [latest, history] = await Promise.allSettled([loadJson("news/latest.json"), loadJson("news/history.json")]);
          const groups = [latest.value, history.value].filter(Boolean);
          state.items = uniqItems(groups);
          if (!state.items.length) throw new Error("표시할 뉴스가 없습니다.");
          renderItem();
        } catch (error) {
          document.getElementById("summary").innerHTML = `<div class="error">뉴스 데이터를 불러오지 못했습니다. 잠시 후 다시 확인하세요.</div>`;
          document.getElementById("grid").innerHTML = "";
          console.error(error);
        }
      }

      document.getElementById("newer").addEventListener("click", () => {
        if (state.index > 0) {
          state.index -= 1;
          renderItem();
          window.scrollTo({ top: 0, behavior: "smooth" });
        }
      });

      document.getElementById("older").addEventListener("click", () => {
        if (state.index < state.items.length - 1) {
          state.index += 1;
          renderItem();
          window.scrollTo({ top: 0, behavior: "smooth" });
        }
      });

      main();
    </script>
  </body>
</html>
